[package]
name = "MSERVE"
version = "3.5.1"
description = "A minecraft server management tool"
authors = ["thetimblank"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hallo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
trash = "5"
walkdir = "2"
zip = { version = "2", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
dunce = "1"
# Pinned to playit's Git release tag. The crates.io versions (agent-core 0.20.1 /
# api-client 0.1.2) are frozen on an old protocol the live playit API now rejects
# with `AgentVersionTooOld` (the agent registration + version structs changed shape).
# All three MUST share the same git source so their types (PortProto, AgentVersion…)
# unify into one. Bump the tag to track playit releases.
playit-agent-core = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.0.10" }
playit-api-client = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.0.10" }
playit-agent-proto = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.0.10" }
uuid = "1"
# Async timers for the in-process playit agent flows (claim polling, tunnel
# allocation waits). The full tokio runtime is already pulled by playit-agent-core.
tokio = { version = "1", features = ["time"] }
# `CancellationToken`, the stop handle for the in-process playit agent (must unify
# with the version `playit-agent-core` uses).
tokio-util = "0.7"
# Surfaces the playit agent crates' `tracing` diagnostics (they log connection/auth
# failures via `tracing`, which is otherwise dropped with no subscriber installed).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Adoptium ships tar.gz (not zip) for Linux/macOS Java downloads.
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# Size-optimized release build. `opt-level = "s"` trades a little speed for a
# smaller binary (the workload here — RCON/telemetry/IO — isn't hot), while LTO +
# a single codegen unit let the linker drop dead code across crates. `strip`
# removes symbols and `panic = "abort"` drops unwinding tables (a panic already
# means the app is going down). Drop `panic = "abort"` if a future feature needs
# `catch_unwind`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

