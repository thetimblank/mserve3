name: E2E nightly

# The slow real-server matrix (L4): downloads real provider jars and boots them
# with a real JVM. Runs on a schedule and on demand — never blocks normal PRs.
on:
   schedule:
      # 07:00 UTC daily.
      - cron: '0 7 * * *'
   workflow_dispatch:

concurrency:
   group: e2e-nightly
   cancel-in-progress: true

# Must match ci.yml so the rust-cache key (which hashes CARGO_* env) is shared.
env:
   CARGO_PROFILE_DEV_DEBUG: '0'
   CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
   e2e:
      name: Real-server matrix
      runs-on: windows-latest
      # A full boot matrix can take a while; cap it generously.
      timeout-minutes: 45

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Rust
           uses: dtolnay/rust-toolchain@stable

         # Same shared-key + env as ci.yml's rust-test job, so this daily run keeps
         # the Windows dependency cache warm for PRs.
         - name: Cache Rust build
           uses: Swatinem/rust-cache@v2
           with:
              workspaces: src-tauri
              shared-key: test

         # The L4 harness reads JAVA_HOME to find the JVM that boots the servers.
         # Use a recent JDK so the newest Paper/vanilla jars (which track the latest
         # Java major) actually boot instead of skipping on an UnsupportedClassVersionError.
         - name: Setup Java (Temurin 25)
           uses: actions/setup-java@v4
           with:
              distribution: temurin
              java-version: 25

         - name: Run real-server E2E matrix
           working-directory: src-tauri
           # REQUIRE=1 turns a "no JVM / jar too new for this JDK" skip into a hard
           # failure, so a green nightly means servers genuinely booted (the modded
           # case, which needs an unavailable custom jar, skips regardless).
           env:
              MSERVE_E2E_REQUIRE: '1'
           run: cargo test --test e2e -- --ignored --nocapture
