name: CI

on:
   pull_request:
   push:
      branches:
         - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read
   pull-requests: read # paths-filter reads the PR's changed files

env:
   # No debuginfo in CI builds: much smaller target dir (faster cache save/restore)
   # and faster linking. Panic messages still carry file:line.
   CARGO_PROFILE_DEV_DEBUG: '0'
   CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
   # Decide which halves of the repo a change touches so docs-only or
   # frontend-only changes don't pay for a Rust build (and vice versa).
   # Skipped jobs count as passing.
   changes:
      name: Detect changes
      runs-on: ubuntu-latest
      outputs:
         frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
         rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.ci == 'true' }}
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Filter paths
           id: filter
           uses: dorny/paths-filter@v3
           with:
              # A file matches a filter only if it matches every pattern in it.
              predicate-quantifier: every
              filters: |
                 frontend:
                   - '!src-tauri/**'
                   - '!docs/**'
                   - '!.claude/**'
                   - '!.github/**'
                   - '!.githooks/**'
                   - '!**/*.md'
                 rust:
                   - 'src-tauri/**'
                   - '!**/*.md'
                 ci:
                   - '.github/workflows/ci.yml'

   # The frontend is OS-independent, so it runs once (Linux) and needs no Rust.
   frontend:
      name: Frontend
      needs: changes
      if: needs.changes.outputs.frontend == 'true'
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: npm

         - name: Install frontend dependencies
           run: npm ci

         - name: Frontend typecheck + build
           run: npm run build

         - name: Frontend tests (Vitest)
           run: npm run test:run

   # Debug builds don't embed `dist/` (tauri-codegen uses devUrl when the
   # `custom-protocol` feature is off), so the Rust jobs skip Node entirely.
   rust-test:
      name: Rust tests (${{ matrix.os }})
      needs: changes
      if: needs.changes.outputs.rust == 'true'
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            os: [windows-latest, ubuntu-latest]
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Install Linux system dependencies (Tauri)
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

         - name: Setup Rust
           uses: dtolnay/rust-toolchain@stable

         # Shared with e2e-nightly (same profile + env), so the daily nightly keeps
         # the Windows dependency cache warm. Only main writes caches: PR runs
         # restore main's, instead of each PR storing its own ~1 GB copy and
         # evicting main's from the 10 GB repo quota.
         - name: Cache Rust build
           uses: Swatinem/rust-cache@v2
           with:
              workspaces: src-tauri
              shared-key: test
              save-if: ${{ github.ref == 'refs/heads/main' }}

         - name: Rust unit + integration tests (L1 + L3)
           working-directory: src-tauri
           run: cargo test

   # `cargo clippy` and `cargo test` can't share artifacts (check vs build), so
   # lint runs in its own job in parallel instead of in series after the tests.
   rust-lint:
      name: Rust lint (${{ matrix.os }})
      needs: changes
      if: needs.changes.outputs.rust == 'true'
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            os: [windows-latest, ubuntu-latest]
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Install Linux system dependencies (Tauri)
           if: runner.os == 'Linux'
           run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

         - name: Setup Rust
           uses: dtolnay/rust-toolchain@stable
           with:
              components: rustfmt, clippy

         - name: Rust format check
           if: runner.os == 'Linux'
           working-directory: src-tauri
           run: cargo fmt --check

         - name: Cache Rust build
           uses: Swatinem/rust-cache@v2
           with:
              workspaces: src-tauri
              shared-key: lint
              save-if: ${{ github.ref == 'refs/heads/main' }}

         # Clippy runs as a report, not a hard gate: the existing codebase has
         # pre-existing style warnings. Tighten to `-- -D warnings` once those are
         # cleared so new lints fail the build.
         - name: Rust lint (clippy, non-blocking)
           working-directory: src-tauri
           run: cargo clippy --all-targets
           continue-on-error: true
